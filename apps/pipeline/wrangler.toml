name = "osn-pipeline"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
USER_AGENT = "TheOpenSourceNewsBot/1.0 (+https://theopensource.news/our-approach)"
MATCH_THRESHOLD = "0.8"
MAX_REDIRECTS = "5"
MONTHLY_COST_CAP_USD = "25.00"
PER_ITEM_COST_CAP_USD = "0.005"

# Secrets configured strictly via:
#   npx wrangler secret put INGEST_HMAC_SECRET
#   npx wrangler secret put GEMINI_API_KEY

# Run live RSS sync every 10 minutes + hourly sweep
[triggers]
crons = ["*/10 * * * *", "0 * * * *"]

# Use the same D1 database_id created for osn-api
[[d1_databases]]
binding = "DB"
database_name = "osn-production"
database_id = "00000000-0000-0000-0000-000000000001"

# Use the same KILL_SWITCH_KV id created for osn-api
[[kv_namespaces]]
binding = "KILL_SWITCH_KV"
id = "00000000000000000000000000000002"

[[queues.producers]]
binding = "HARVEST_QUEUE"
queue = "osn-harvest-jobs"

[[queues.consumers]]
queue = "osn-harvest-jobs"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "osn-harvest-dlq"

[[services]]
binding = "API_SERVICE"
service = "osn-api"

[env.staging]
name = "osn-pipeline-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "osn-staging"
database_id = "00000000-0000-0000-0000-000000000011"

[[env.staging.kv_namespaces]]
binding = "KILL_SWITCH_KV"
id = "00000000000000000000000000000012"

[[env.staging.services]]
binding = "API_SERVICE"
service = "osn-api-staging"
